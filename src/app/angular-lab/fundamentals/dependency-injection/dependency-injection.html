<article class="concept-sheet">
  <app-concept-header
    category="Fondamentaux"
    [sheetNumber]="5"
    title="Injection de dépendances"
    description="Comprendre comment Angular construit, partage et remplace les services à travers sa hiérarchie d’injecteurs."
    level="Fondamental"
  />
  <app-concept-tabs [activeTab]="activeTab()" (tabChange)="activeTab.set($event)" />
  <div class="concept-content">
    <section class="workspace">
      @if (activeTab() === 'demo') {
        <div class="panel demo-panel">
          <app-demo-header
            [icon]="iconPath + '/architecture.png'"
            title="Comparer la portée des providers"
            description="Observe le partage ou l’isolation de deux instances de composant."
          />
          <div class="scope-switch">
            <button
              type="button"
              [class.is-active]="scope() === 'root'"
              (click)="changeScope('root')"
            >
              Provider root</button
            ><button
              type="button"
              [class.is-active]="scope() === 'component'"
              (click)="changeScope('component')"
            >
              Provider composant
            </button>
          </div>
          <div class="lab-demo-grid">
            <div class="lab-demo-card">
              <span class="lab-demo-chip">Composant A</span>
              <h4>{{ leftValue() }}</h4>
              <button class="lab-demo-action" type="button" (click)="increment('left')">
                Incrémenter A
              </button>
            </div>
            <div class="lab-demo-card">
              <span class="lab-demo-chip">Composant B</span>
              <h4>{{ rightValue() }}</h4>
              <button class="lab-demo-action" type="button" (click)="increment('right')">
                Incrémenter B
              </button>
            </div>
          </div>
          <p class="scope-explanation">
            {{
              scope() === 'root'
                ? 'Les deux composants reçoivent la même instance.'
                : 'Chaque composant possède sa propre instance.'
            }}
          </p>
        </div>
      }
      @if (activeTab() === 'code') {
        <div class="code-stack">
          <app-code-preview
            filename="counter.service.ts"
            [code]="serviceCode"
            caption="Service injectable"
          /><app-code-preview
            filename="app.config.ts"
            [code]="tokenCode"
            caption="InjectionToken"
          />
          <app-code-preview
            filename="local-counter.ts"
            [code]="localProviderCode"
            caption="Provider déclaré dans le composant"
          />
          <app-code-walkthrough [items]="walkthrough" />
        </div>
      }
      @if (activeTab() === 'comparison') {
        <app-concept-comparison [items]="comparisons" />
      }
      <app-concept-pagination
        [current]="5"
        previousRoute="../directives-pipes"
        nextRoute="../cycle-vie-rendu"
      />
    </section>
    <app-concept-learning [content]="learning" />
  </div>
</article>
